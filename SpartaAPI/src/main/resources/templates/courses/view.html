<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
    <h1>Course Details</h1>

    <div class="card mt-3">
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${course.courseId}"></span></p>
            <p><strong>Title:</strong> <span th:text="${course.title}"></span></p>
            <p><strong>Description:</strong> <span th:text="${course.description}"></span></p>
            <p><strong>Start Date:</strong> <span th:text="${course.startDate}"></span></p>
            <p><strong>End Date:</strong> <span th:text="${course.endDate}"></span></p>
            <p><strong>Trainer ID:</strong> <span th:text="${course.trainerId}"></span></p>

            <div class="mt-3">
                <a class="btn btn-secondary" th:href="@{/courses}">Back</a>

                <a class="btn btn-warning"
                   th:href="@{/courses/{id}/edit(id=${course.courseId})}">Edit</a>

                <form th:action="@{/courses/{id}/delete(id=${course.courseId})}"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('Delete this course?');">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
