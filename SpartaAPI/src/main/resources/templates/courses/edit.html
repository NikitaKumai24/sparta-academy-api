<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
    <h1 class="mb-4">Edit Course</h1>


    <form th:action="@{/courses/{id}/edit(id=${course.courseId})}"
          th:object="${course}"
          method="post">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />


        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>

        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Start Date</label>

                <input type="date" class="form-control" th:field="*{startDate}" required>
            </div>

            <div class="col mb-3">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" th:field="*{endDate}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Trainer ID</label>
            <input type="number" class="form-control" th:field="*{trainerId}" required min="1">
        </div>

        <button class="btn btn-primary" type="submit">Save Changes</button>
        <a class="btn btn-secondary" th:href="@{/courses}">Cancel</a>
    </form>


    <form th:action="@{/courses/{id}/delete(id=${course.courseId})}"
          method="post"
          class="mt-3"
          onsubmit="return confirm('Delete this course?');">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <button class="btn btn-danger" type="submit">Delete Course</button>
    </form>
</div>

</body>
</html>
