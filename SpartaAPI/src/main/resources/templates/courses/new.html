<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
    <h1>Create Course</h1>

    <form th:action="@{/courses/new}" th:object="${course}" method="post" class="mt-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>

        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" th:field="*{startDate}" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" th:field="*{endDate}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Trainer ID</label>
            <input type="number" class="form-control" th:field="*{trainerId}" required min="1">
            <div class="form-text">Try trainerId 1 or 2 (seeded).</div>
        </div>

        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/courses}">Cancel</a>
    </form>
</div>

</body>
</html>
