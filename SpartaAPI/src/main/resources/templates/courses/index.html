<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Courses</h1>
        <form th:action="@{/courses/search}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" name="query" class="form-control" placeholder="Search by title" required>
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
        <a class="btn btn-primary" th:href="@{/courses/new}" sec:authorize="hasAnyRole('ADMIN', 'TRAINER')">Add Course</a>
    </div>

    <table class="table table-striped" th:if="${!#lists.isEmpty(courses)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Start</th>
            <th>End</th>
            <th>Trainer</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.courseId}"></td>
            <td th:text="${course.title}"></td>
            <td th:text="${course.startDate}"></td>
            <td th:text="${course.endDate}"></td>
            <td th:text="${course.trainerId}"></td>
            <td>
                <a class="btn btn-sm btn-info"
                   th:href="@{/courses/{id}(id=${course.courseId})}">View</a>

                <a class="btn btn-sm btn-warning"
                   th:href="@{/courses/{id}/edit(id=${course.courseId})}" sec:authorize="hasAnyRole('ADMIN', 'TRAINER')">Edit</a>

<form th:action="@{/courses/{id}/delete(id=${course.courseId})}"
      method="post"
      class="d-inline"
      onsubmit="return confirm('Delete this course?');"
      sec:authorize="hasAnyRole('ADMIN', 'TRAINER')">

    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <button class="btn btn-sm btn-danger" type="submit">Delete</button>
</form>

            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(courses)}" class="text-muted">
        No courses available.
    </p>
</div>

</body>
</html>
