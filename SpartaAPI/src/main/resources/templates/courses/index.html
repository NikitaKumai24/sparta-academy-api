<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center">Course List</h1>
        <div>
            <a href="/" class="btn btn-secondary me-2">Back</a>
            <a href="/courses/new" class="btn btn-primary">Add New Course</a>
        </div>
    </div>

    <table class="table table-striped mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Trainer ID</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.courseId}"></td>
            <td th:text="${course.title}"></td>
            <td th:text="${course.description}"></td>
            <td th:text="${course.startDate}"></td>
            <td th:text="${course.endDate}"></td>
            <td th:text="${course.trainerId}"></td>
            <td>
                <a th:href="@{/courses/{id}(id=${course.courseId})}" class="btn btn-info btn-sm">View</a>
                <form th:action="@{/courses/{id}(id=${course.courseId})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(courses)}">
            <td colspan="7" class="text-center text-muted">No courses available</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
