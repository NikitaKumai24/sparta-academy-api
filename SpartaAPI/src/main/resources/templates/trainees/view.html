<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trainee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
    <h1 class="text-center">Edit Trainee</h1>

    <!-- Main Edit Form -->
    <form th:action="@{/trainees/{id}/update(id=${trainee.traineeId})}"
          th:object="${trainee}"
          method="post"
          class="mt-4">

        <!-- ID (read-only) -->
        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control-plaintext text-muted"
                   th:value="*{traineeId}"
                   readonly>
        </div>

        <!-- First Name -->
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{firstName}"
                   required>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{lastName}"
                   required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <!-- Phone Number -->
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text"
                   class="form-control"
                   th:field="*{phoneNumber}">
        </div>

        <!-- Specialty Language -->
        <div class="mb-3">
            <label class="form-label">Specialty Language</label>
            <input type="text"
                   class="form-control"
                   th:field="*{specialityLang}">
        </div>

        <!-- Course -->
        <div class="mb-3">
            <label class="form-label">Course</label>
            <select class="form-select"
                    th:field="*{courseId}"
                    required>
                <option value="">-- Select a course --</option>
                <option th:each="course : ${courses}"
                        th:value="${course.courseId}"
                        th:text="${course.title}">
                </option>
            </select>
        </div>


        <!-- Buttons -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary me-2" sec:authorize="hasRole('ADMIN')">
                Save
            </button>

            <a th:href="@{/trainees}" class="btn btn-secondary me-2" sec:authorize="hasRole('ADMIN')">
                Cancel
            </a>
            <a th:href="@{/trainees}" class="btn btn-secondary me-2" sec:authorize="hasAnyRole('TRAINEE', 'TRAINER')">
                Back
            </a>
        </div>
    </form>

    <!-- Delete Form (separate) -->
    <div class="text-center mt-3">
        <form th:action="@{/trainees/{id}(id=${trainee.traineeId})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this trainee?')"
              sec:authorize="hasRole('ADMIN')">
            <button type="submit" class="btn btn-danger">
                Delete
            </button>
        </form>
    </div>
</div>

</body>
</html>
