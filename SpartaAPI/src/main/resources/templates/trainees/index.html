<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainee List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center">Trainee List</h1>
        <div>
            <a href="/" class="btn btn-secondary me-2">Back</a>
            <a href="/trainees/new" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Add New Trainee</a>
        </div>
    </div>
    <table class="table table-striped mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course ID</th>
            <th>Speciality</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="trainee : ${trainees}">
            <td th:text="${trainee.traineeId}"></td>
            <td th:text="|${trainee.firstName} ${trainee.lastName}|"></td>
            <td th:text="${trainee.courseId}"></td>
            <td th:text="${trainee.specialityLang}"></td>
            <td th:text="${trainee.email}"></td>
            <td th:text="${trainee.phoneNumber}"></td>
            <td>
                <a th:href="@{/trainees/{id}(id=${trainee.traineeId})}" class="btn btn-info btn-sm">View</a>
                <form th:action="@{/trainees/{id}(id=${trainee.traineeId})}" method="post" style="display: inline;" sec:authorize="hasRole('ADMIN')">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
