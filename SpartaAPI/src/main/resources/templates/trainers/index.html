<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center">Trainer List</h1>
        <form th:action="@{/trainers/search}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" name="query" class="form-control" placeholder="Search by name or specialty" required>
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
        <div>
            <a href="/" class="btn btn-secondary me-2">Back</a>
            <a href="/trainers/new" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">Add New Trainer</a>
        </div>
    </div>

    <table class="table table-striped mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Speciality</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Favourite Animal</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="trainer : ${trainers}">
            <td th:text="${trainer.trainerId}"></td>
            <td th:text="|${trainer.firstName} ${trainer.lastName}|"></td>
            <td th:text="${trainer.specialityLang}"></td>
            <td th:text="${trainer.email}"></td>
            <td th:text="${trainer.phoneNumber}"></td>
            <td th:text="${trainer.favAnimal}"></td>
            <td>
                <a th:href="@{/trainers/{id}(id=${trainer.trainerId})}" class="btn btn-info btn-sm">View</a>
                <form th:action="@{/trainers/{id}(id=${trainer.trainerId})}" method="post" style="display: inline;" sec:authorize="hasRole('ADMIN')">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
