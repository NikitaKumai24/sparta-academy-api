<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
    <h1 class="text-center">Edit Trainer</h1>

    <!-- Main Edit Form -->
    <form th:action="@{/trainers/{id}/update(id=${trainer.trainerId})}"
          th:object="${trainer}"
          method="post"
          class="mt-4">

        <!-- ID (read-only) -->
        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text"
                   class="form-control-plaintext text-muted"
                   th:value="*{trainerId}"
                   readonly>
        </div>

        <!-- First Name -->
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{firstName}"
                   required>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{lastName}"
                   required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <!-- Phone Number -->
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text"
                   class="form-control"
                   th:field="*{phoneNumber}">
        </div>

        <!-- Specialty Language -->
        <div class="mb-3">
            <label class="form-label">Specialty Language</label>
            <input type="text"
                   class="form-control"
                   th:field="*{specialityLang}">
        </div>

        <!-- Favourite Animal -->
        <div class="mb-3">
            <label class="form-label">Favourite Animal</label>
            <input type="text"
                   class="form-control"
                   th:field="*{favAnimal}">
        </div>

        <!-- Buttons -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary me-2">
                Save
            </button>

            <a th:href="@{/trainers}" class="btn btn-secondary me-2">
                Cancel
            </a>
        </div>
    </form>

    <!-- Delete Form -->
    <div class="text-center mt-3">
        <form th:action="@{/trainers/{id}(id=${trainer.trainerId})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this trainee?')">
            <button type="submit" class="btn btn-danger">
                Delete
            </button>
        </form>
    </div>

</div>

</body>
</html>
