<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-5">

    <h1 class="text-center">Create New Trainer</h1>

    <form th:action="@{/trainers/new}"
          th:object="${trainer}"
          method="post"
          class="mt-4">

        <!-- First Name -->
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{firstName}"
                   required>
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text"
                   class="form-control"
                   th:field="*{lastName}"
                   required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <!-- Phone Number -->
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text"
                   class="form-control"
                   th:field="*{phoneNumber}">
        </div>

        <!-- Speciality Language -->
        <div class="mb-3">
            <label class="form-label">Speciality Language</label>
            <input type="text"
                   class="form-control"
                   th:field="*{specialityLang}">
        </div>

        <!-- Favourite Animal -->
        <div class="mb-3">
            <label class="form-label">Favourite Animal</label>
            <input type="text"
                   class="form-control"
                   th:field="*{favAnimal}">
        </div>

        <!-- Buttons -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary me-2">
                Create
            </button>

            <a th:href="@{/trainers}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>
</div>
</body>
</html>
