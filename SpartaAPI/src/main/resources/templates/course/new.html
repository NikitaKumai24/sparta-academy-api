<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="m-0">New Course</h1>
        <a class="btn btn-outline-secondary" th:href="@{/course}">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/course}" th:object="${course}" method="post">

                <!-- title -->
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" type="text" th:field="*{title}" placeholder="e.g. Java Basics">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <!-- description -->
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="3" th:field="*{description}" placeholder="Short description..."></textarea>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <!-- dates -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Start Date</label>
                        <input class="form-control" type="date" th:field="*{startdate}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('startdate')}"
                             th:errors="*{startdate}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">End Date</label>
                        <input class="form-control" type="date" th:field="*{enddate}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('enddate')}"
                             th:errors="*{enddate}"></div>
                    </div>
                </div>

                <!-- trainer id -->
                <div class="mb-3">
                    <label class="form-label">Trainer ID</label>
                    <input class="form-control" type="number" th:field="*{trainerid}" placeholder="e.g. 12">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('trainerid')}"
                         th:errors="*{trainerid}"></div>
                </div>

                <button class="btn btn-primary" type="submit">Create</button>
                <a class="btn btn-outline-secondary ms-2" th:href="@{/courses}">Cancel</a>
            </form>

        </div>
    </div>

</div>
</body>
</html>
