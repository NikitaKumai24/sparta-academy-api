<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Course</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-5">
  <h1 class="text-center">Edit Course</h1>

  <!-- Main Edit Form -->
  <form th:action="@{/course/{id}/update(id=${course.courseId})}"
        th:object="${course}"
        method="post"
        class="mt-4">

    <!-- ID (read-only) -->
    <div class="mb-3">
      <label class="form-label">ID</label>
      <input type="text"
             class="form-control-plaintext text-muted"
             th:value="*{coureId}"
             readonly>
    </div>

    <!-- Course Name -->
    <div class="mb-3">
      <label class="form-label">Course Name</label>
      <input type="text"
             class="form-control"
             th:field="*{courseName}"
             required>
    </div>

    <!-- Duration -->
    <div class="mb-3">
      <label class="form-label">Duration</label>
      <input type="text"
             class="form-control"
             th:field="*{duration}">
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control"
                th:field="*{description}"
                rows="3">
            </textarea>
    </div>

    <!-- Buttons -->
    <div class="text-center">
      <button type="submit" class="btn btn-primary me-2">
        Save
      </button>

      <a th:href="@{/course}" class="btn btn-secondary me-2">
        Cancel
      </a>
    </div>
  </form>

  <!-- Delete Form (separate) -->
  <div class="text-center mt-3">
    <form th:action="@{/course/{id}(id=${course.courseId})}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this course?')">
      <button type="submit" class="btn btn-danger">
        Delete
      </button>
    </form>
  </div>
</div>

</body>
</html>
